services:
  helper:
    # yamllint disable-line rule:line-length
    image: ghcr.io/chamburr/modmail-helper:latest@sha256:c0120589df3bae3182a2ee19c431c1568f932deb62c48ec6a0e42fe51c7a6481
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - printenv CONFIG > /app/config.json && yarn start
    environment:
      - CONFIG=${CONFIG}
