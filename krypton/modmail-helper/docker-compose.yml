services:
  helper:
    # yamllint disable-line rule:line-length
    image: ghcr.io/chamburr/modmail-helper:latest@sha256:1f08dc648b7e85b20a772987c0d3ab9e44e73758c801de238ee6053b93d6dbbe
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - printenv CONFIG > /app/config.json && yarn start
    environment:
      - CONFIG=${CONFIG}
